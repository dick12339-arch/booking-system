  console.log("%c🌸 雲芳療預約系統 "+VER+" | Build "+BUILD+" | 黑金版已修復日期", "color:#E8C87A;background:#1A160F;padding:8px 12px;border-radius:8px;font-weight:bold");

  window.__APP_VERSION__ = VER;

  // Fix any remaining date inputs that still show 2026-09-14 due to cached value
  function fixDateInputs(){
    const todayLocal = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD local
    document.querySelectorAll('input[type="date"]').forEach(input=>{
      // If value is yesterday or empty, set to today
      // Compare: if input value != today and it's within 1 day difference, fix it
      try{
        const val = input.value;
        if(!val) { input.value = todayLocal; return; }
        // If it's 2026-09-14 but today is 9/15, fix
        const today = new Date();
        const todayStr = today.toLocaleDateString('en-CA');
        if(val !== todayStr){
          // Only auto-fix if the UI shows 2026年9月14日 but header shows 9/15
          const headerDate = document.body.innerText.match(/9\/15|9月15/);
          if(headerDate) { input.value = todayStr; console.log("日期已自動修正:", val, "->", todayStr); }
        }
      }catch(e){}
    });
  }
  // Run after React mount
  setTimeout(fixDateInputs, 800);
  setTimeout(fixDateInputs, 2000);
  // Observe for name lock
  function lockLineName(){

    const checkAndLock = ()=>{

        if(!nameInput.readOnly){
          // Only lock if value came from LINE (length >1 and not user typing after load? We lock if LIFF available)

<script id="tg-line-auto-v384-tg">
(function(){
  const VERSION="v3.8.4-tg-line-auto";
  console.log(`%c${VERSION} | TG+LINE auto`, "color:#7ED321;background:#1A160F;padding:6px 10px;border-radius:8px");
  window.__APP_VERSION__ = VERSION + " | " + (window.__APP_VERSION__||"");

  function lockNameGlobal(displayName, source){
    // 嘗試找到姓名輸入框 - V3.8.3 原始可能是 input placeholder 包含 LINE 名字
    const selectors = [
      'input[placeholder*="LINE 名字"]',
      'input[placeholder*="自動帶入"]',
      '#clientName',
      'input[placeholder*="姓名"]'
    ];
    let nameInput=null;
    for(let sel of selectors){
      const el=document.querySelector(sel);
      if(el){nameInput=el;break;}
    }
    if(!nameInput){
      // fallback: first text input
      nameInput=document.querySelector('input[type="text"]');
    }
    if(!nameInput) return;
    if(nameInput.value && nameInput.readOnly) return; // already locked
    nameInput.value=displayName;
    nameInput.readOnly=true;
    try{
      nameInput.classList.add('locked');
    }catch{}
    nameInput.style.background='#1A1815';
    nameInput.style.borderColor='#3A352E';
    nameInput.style.color='#E8C87A';
    nameInput.title=`🔒 ${source} 名稱已鎖定，不可更改`;
    // badge
    if(!document.getElementById('lock-badge-tg')){
      const badge=document.createElement('div');
      badge.id='lock-badge-tg';
      badge.textContent=`🔒 已鎖定 ${source}：${displayName}`;
      badge.style.cssText='font-size:10px;color:#2E7D32;background:#E8F5E9;padding:4px 8px;border-radius:8px;margin-top:6px;display:inline-block';
      nameInput.parentNode.appendChild(badge);
    }
    // source badge
    const sourceBadge=document.getElementById('sourceBadge') || document.querySelector('[id*="source"]');
    if(sourceBadge){
      sourceBadge.textContent=`✅ 已帶入 ${source}`;
      sourceBadge.style.color='#7ED321';
    }
    localStorage.setItem(source.toLowerCase()+'_display_name', displayName);
  }

  async function initTG(){
    try{
      if(window.Telegram && window.Telegram.WebApp){
        const tg=window.Telegram.WebApp;
        tg.ready();
        try{tg.expand();}catch{}
        const user=tg.initDataUnsafe?.user;
        if(user){
          const tgName=[user.first_name, user.last_name].filter(Boolean).join(' ') || user.username || '';
          if(tgName){
            lockNameGlobal(tgName, 'TG');
            localStorage.setItem('tg_user_id', String(user.id));
            localStorage.setItem('tg_display_name', tgName);
            console.log('TG 名稱已鎖定', tgName);
            return true;
          }
        }
      }
    }catch(e){console.error('TG init fail', e);}
    return false;
  }

  async function initLINE(){
    try{
      if(typeof liff!=='undefined'){
        // 避免重複 init
        try{await liff.init({liffId:"2011603822-2fmJb2AS"});}catch{}
        if(liff.isLoggedIn()){
          const profile=await liff.getProfile();
          lockNameGlobal(profile.displayName, 'LINE');
          localStorage.setItem('line_display_name', profile.displayName);
          localStorage.setItem('line_user_id', profile.userId);
          console.log('LINE 名稱已鎖定', profile.displayName);
          return true;
        }
      }
    }catch(e){console.error('LINE init fail', e);}
    return false;
  }

  async function initAuto(){
    // TG 優先，因為 TG 環境內不會有 LINE
    const tgOk=await initTG();
    if(tgOk) return;
    const lineOk=await initLINE();
    if(lineOk) return;
    // fallback cache
    const savedTg=localStorage.getItem('tg_display_name');
    const savedLine=localStorage.getItem('line_display_name');
    if(savedTg){
      lockNameGlobal(savedTg, 'TG(快取)');
      return;
    }
    if(savedLine){
      lockNameGlobal(savedLine, 'LINE(快取)');
      return;
    }
  }

  setTimeout(initAuto, 800);
  setTimeout(initAuto, 2000);
})();
</script>


<script id="patch-schedule-sync-blacklist-v385">
(function(){
  const VERSION="v3.8.5-sync-schedule-blacklist";
  console.log(`%c${VERSION} | 新版班表自動帶入當天班表 + 黑名單獨立`, "color:#E8C87A;background:#1A160F;padding:6px 10px;border-radius:8px");
  window.__APP_VERSION__ = VERSION;

  function parseHour(s){s=String(s).replace('：',':').trim(); if(s.includes(':')){const h=parseInt(s.split(':')[0],10);return isNaN(h)?null:h;} const h=parseInt(s,10); return isNaN(h)?null:h;}
  function parseScheduleInput(text){
    const result={}; const list=[];
    if(!text) return {result,list};
    const lines=text.split(/[\n,;；]+/).map(s=>s.trim()).filter(Boolean);
    for(let line of lines){
      line=line.replace(/\s+/g,'');
      const m=line.match(/^([^\d:：-]+)([\d:]+)-([\d:]+)/);
      if(!m) continue;
      const name=m[1].trim(); const start=parseHour(m[2]); const end=parseHour(m[3]);
      if(start===null||end===null) continue;
      if(!result[name]) result[name]=[];
      result[name].push({start,end,cross:end<=start,raw:line});
      if(!list.includes(name)) list.push(name);
    }
    return {result,list};
  }

  function saveSchedule(text){
    const {result,list}=parseScheduleInput(text);
    localStorage.setItem('todayScheduleRaw', text);
    localStorage.setItem('todayScheduleParsed', JSON.stringify(result));
    const payload=JSON.stringify({dateKey:new Date().toLocaleDateString('en-CA'), beauticians:list, shifts:result, raw:text});
    localStorage.setItem('beautician_schedule_today', payload);
    localStorage.setItem('today_schedule', payload);
    localStorage.setItem('schedule_today', payload);
    // also try to overwrite any existing beautician schedule key
    for(let k of Object.keys(localStorage)){
      if(k.includes('beautician') && k.includes('schedule')){
        try{
          const existing=JSON.parse(localStorage.getItem(k)||'{}');
          if(existing.beauticians || existing.dateKey || Array.isArray(existing)){
            localStorage.setItem(k, payload);
          }
        }catch{}
      }
    }
    return {result,list};
  }

  function syncToOriginalCheckboxes(desiredList){
    // 找到當天班表設定的 grid：class 包含 grid-cols-2 且裡面有美容師按鈕
    const grids=document.querySelectorAll('div[class*="grid-cols-2"]');
    let targetGrid=null;
    for(let g of grids){
      if(g.textContent.includes('花花') || g.textContent.includes('小魚') || g.querySelector('button')){
        // 檢查是否在當天班表設定卡片內
        const card=g.closest('div[class*="rounded-[20px]"]');
        if(card && card.textContent.includes('當天班表設定')){
          targetGrid=g;
          break;
        }
      }
    }
    if(!targetGrid){
      console.log('找不到原始班表 grid，稍後重試');
      return false;
    }
    const buttons=targetGrid.querySelectorAll('button');
    console.log(`找到 ${buttons.length} 個美容師按鈕，欲設定:`, desiredList);
    buttons.forEach(btn=>{
      const name=btn.textContent.trim().replace('✓','').trim();
      // 清理名字：取第一個詞
      const cleanName=name.split(/\s+/)[0];
      const shouldBeSelected=desiredList.includes(cleanName) || desiredList.some(d=>cleanName.includes(d)||d.includes(cleanName));
      const isSelected=btn.className.includes('bg-[#E8C76A]/15') || btn.innerHTML.includes('✓') || btn.querySelector('span')?.textContent==='✓';
      if(shouldBeSelected!==isSelected){
        btn.click();
        console.log(`切換 ${cleanName}: ${isSelected} -> ${shouldBeSelected}`);
      }
    });
    return true;
  }

  function injectUI(){ return; }

  function injectBlacklistIndependent(){ return; }

    })();
</script>
